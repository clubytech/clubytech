name: Snake

# The contribution graph, eaten. Regenerated on a schedule and on demand rather than on every push,
# because the graph changes whether or not this repository does.
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  snake:
    runs-on: ubuntu-latest
    permissions:
      # The action writes the generated SVGs to a branch of its own; without this it fails at the
      # very last step, after doing all the work, which is a confusing way to find out.
      contents: write
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # Two files, one per theme. A single dark-only snake is invisible for anyone reading
          # GitHub in light mode, which is most people.
          # Exactly five dot colours, which is what the action accepts: empty, then four rising
          # levels. The first one matters more than it looks — it is the EMPTY cell, and the first
          # version set it to the brand's darkest green, which is so close to GitHub's own dark
          # background that the board vanished and the snake appeared to travel across nothing.
          # Lifting it gives the snake a visible track, and steepening the top end makes the busiest
          # day read as a flash rather than as one more square.
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#8FE3C4&color_dots=#0B2E22,#14624A,#03926B,#0FAF83,#7BE8C0
            dist/snake-light.svg?palette=github-light&color_snake=#03926B&color_dots=#DCEAE4,#A5DBC6,#40C09C,#0FAF83,#03926B

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
